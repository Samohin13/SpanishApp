<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Type — display</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body {
    margin:0; padding:28px;
    background:
      radial-gradient(40% 50% at 15% 20%, rgba(123,47,190,.12) 0%, transparent 60%),
      radial-gradient(35% 45% at 85% 80%, rgba(255,149,0,.10) 0%, transparent 60%),
      linear-gradient(160deg, #FFFFFF 0%, #F4F4F8 100%);
    font-family:var(--font-sans); color:#1A1A1A;
    min-height:100vh;
  }
  .card {
    padding:22px 24px; border-radius:18px;
    background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(250,250,252,.70));
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border:1px solid rgba(15,4,24,.08);
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 1px 2px rgba(15,4,24,.05),
      0 12px 24px -8px rgba(15,4,24,.10),
      0 28px 40px -16px rgba(15,4,24,.14);
  }
  .row {
    display:grid; grid-template-columns: 220px 1fr; gap:24px;
    align-items:baseline; padding:16px 0;
    border-bottom:1px dashed rgba(15,4,24,.08);
  }
  .row:last-child { border-bottom:0; }

  .meta { display:flex; flex-direction:column; gap:6px; }
  .meta .name {
    font-size:12px; font-weight:800; color:#1A1A1A; letter-spacing:.04em;
    font-family:ui-monospace,Menlo,monospace; text-transform:uppercase;
  }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip {
    font-family:ui-monospace,Menlo,monospace; font-size:10px; font-weight:700;
    background:#FFFFFF; color:#5E5E66;
    padding:3px 7px; border-radius:6px;
    border:1px solid rgba(15,4,24,.08);
  }
  .chip.brand { background:#F4ECFB; color:#7B2FBE; border-color:rgba(123,47,190,.18); }
  .role { font-size:10.5px; color:#8E8E93; }

  .sample { color:#1A1A1A; text-wrap:balance; }
</style>
</head><body>
  <div class="card">
    <div class="row">
      <div class="meta">
        <div class="name">displayLarge</div>
        <div class="chips"><span class="chip brand">34px</span><span class="chip">w 800</span><span class="chip">−1.0</span></div>
        <div class="role">Onboarding hero · big celebration</div>
      </div>
      <div class="sample" style="font-size:34px; font-weight:800; letter-spacing:-1px; line-height:1.1;">¡Hola! · Привет!</div>
    </div>
    <div class="row">
      <div class="meta">
        <div class="name">displayMedium</div>
        <div class="chips"><span class="chip brand">28px</span><span class="chip">w 700</span><span class="chip">−0.5</span></div>
        <div class="role">Section headers · marketing</div>
      </div>
      <div class="sample" style="font-size:28px; font-weight:700; letter-spacing:-0.5px; line-height:1.15;">Изучи испанский</div>
    </div>
    <div class="row">
      <div class="meta">
        <div class="name">headlineLarge</div>
        <div class="chips"><span class="chip brand">24px</span><span class="chip">w 700</span></div>
        <div class="role">Screen titles (Profile · Course)</div>
      </div>
      <div class="sample" style="font-size:24px; font-weight:700;">Mi Perfil · Профиль</div>
    </div>
    <div class="row">
      <div class="meta">
        <div class="name">headlineMedium</div>
        <div class="chips"><span class="chip brand">20px</span><span class="chip">w 700</span></div>
        <div class="role">Card headers (Word-of-day)</div>
      </div>
      <div class="sample" style="font-size:20px; font-weight:700;">Слово дня</div>
    </div>
  </div>
</body></html>
