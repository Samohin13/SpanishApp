<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body {
    margin:0; padding:28px;
    background:
      radial-gradient(40% 50% at 15% 20%, rgba(123,47,190,.18) 0%, transparent 60%),
      radial-gradient(45% 55% at 85% 80%, rgba(224,64,251,.14) 0%, transparent 60%),
      radial-gradient(35% 45% at 70% 15%, rgba(255,149,0,.12) 0%, transparent 65%),
      linear-gradient(160deg, #FFFFFF 0%, #F4F4F8 60%, #E9E9EF 100%);
    font-family:var(--font-sans); color:#1A1A1A;
    min-height:100vh;
  }
  .row {
    display:grid; grid-template-columns:repeat(4,1fr); gap:18px;
    align-items:start;
  }
  .sw { display:flex; flex-direction:column; gap:8px; }
  .box {
    height:104px; border-radius:18px; position:relative; overflow:hidden;
    border: 1px solid rgba(15,4,24,.08);
    background: linear-gradient(180deg, rgba(255,255,255,.78) 0%, rgba(250,250,252,.70) 100%);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    display:flex; align-items:center; justify-content:center;
    color:#5E5E66; font-size:12px; font-family:ui-monospace,Menlo,monospace;
    font-weight:600;
    transition: transform .35s cubic-bezier(.34,1.4,.5,1), box-shadow .35s, border-color .35s;
  }
  .box::before {
    content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(180deg, rgba(255,255,255,.50) 0%, rgba(255,255,255,.08) 45%, rgba(255,255,255,0) 60%);
  }
  .box::after {
    content:""; position:absolute; left:0; right:0; bottom:0; height:35%;
    background: linear-gradient(180deg, rgba(15,4,24,0) 0%, rgba(15,4,24,.05) 100%);
    pointer-events:none;
  }
  .box span { position:relative; z-index:1; }

  /* — elev 1 — tightest, just contact — */
  .e1 {
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 0 0 .5px rgba(255,255,255,.5) inset,
      0 1px 2px rgba(15,4,24,.06),
      0 2px 4px -2px rgba(15,4,24,.06);
  }
  /* — elev 2 — locked / subtle — */
  .e2 {
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 0 0 .5px rgba(255,255,255,.55) inset,
      0 1px 2px rgba(15,4,24,.05),
      0 4px 10px -4px rgba(15,4,24,.10),
      0 10px 18px -8px rgba(15,4,24,.10);
  }
  /* — elev 3 — card, neutral cast — */
  .e3 {
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 0 0 .5px rgba(255,255,255,.6) inset,
      0 -1px 0 rgba(15,4,24,.05) inset,
      0 1px 2px rgba(15,4,24,.06),
      0 8px 16px -6px rgba(15,4,24,.10),
      0 22px 32px -12px rgba(15,4,24,.14);
  }
  /* — elev 4 — large card, purple-tinted — */
  .e4 {
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 0 0 .5px rgba(255,255,255,.7) inset,
      0 -1px 0 rgba(15,4,24,.06) inset,
      0 2px 4px rgba(15,4,24,.08),
      0 14px 22px -6px rgba(123,47,190,.22),
      0 30px 44px -14px rgba(123,47,190,.28);
    border-color: rgba(123,47,190,.18);
  }

  .box:hover {
    transform: translateY(-3px);
    border-color: rgba(15,4,24,.12);
  }

  .name { font-size:13px; font-weight:700; color:#1A1A1A; letter-spacing:-.01em; }
  .role { font-size:11px; color:#8E8E93; }
  .css { font-family:ui-monospace,Menlo,monospace; font-size:10px; color:#5E5E66;
         background:rgba(255,255,255,.6); border:1px solid rgba(15,4,24,.06);
         border-radius:6px; padding:3px 6px; align-self:flex-start; font-weight:600; }
</style>
</head><body>
<div class="row">
  <div class="sw">
    <div class="box e1"><span>elev 1</span></div>
    <div class="name">Row · 1dp</div>
    <div class="role">Sub-lesson hover surface</div>
    <div class="css">2 inner + 2 ambient</div>
  </div>
  <div class="sw">
    <div class="box e2"><span>elev 2</span></div>
    <div class="name">Locked · 2dp</div>
    <div class="role">Disabled card depth</div>
    <div class="css">2 inner + 3 ambient</div>
  </div>
  <div class="sw">
    <div class="box e3"><span>elev 3</span></div>
    <div class="name">Card · 4dp</div>
    <div class="role">Streak · Word-of-day</div>
    <div class="css">3 inner + 3 ambient</div>
  </div>
  <div class="sw">
    <div class="box e4"><span>elev 4</span></div>
    <div class="name">Card LG · 6dp</div>
    <div class="role">Topic · Course (purple)</div>
    <div class="css">3 inner + 2 purple ambient</div>
  </div>
</div>
</body></html>
