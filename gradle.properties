# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m
kotlin.daemon.jvm.options=-Xmx6144m
kotlin.incremental=false
# KSP incremental cache breaks every few sessions on Windows
# (NoSuchFileException for AppDatabase_Impl.java, IncrementalUtilKt.copyWithTimestamp,
#  generated source desync). Trade ~30s/build for never debugging this again.
ksp.incremental=false
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.useAndroidX=true
android.enableJetifier=false
# v1.25.97 compliance: targetSdk/compileSdk 36 (Play требует к 31 авг 2026).
# AGP 8.7.3 протестирован до compileSdk 35 и печатает warning на 36 — флаг
# его гасит (санкционировано Google). ⚠️ Рекомендуемый follow-up: поднять AGP
# до 8.9+ (первая версия с официальной поддержкой API 36) в связке с
# device-тестом покупок перед релизом, тогда флаг можно убрать.
android.suppressUnsupportedCompileSdk=36