<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<title>EASPEAK · iOS UI Kit</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; height:100%;
               font-family: var(--font-sans);
               background:
                 radial-gradient(60% 50% at 80% 10%, rgba(255,180,0,.18) 0%, transparent 60%),
                 radial-gradient(50% 60% at 15% 90%, rgba(214,40,103,.14) 0%, transparent 60%),
                 linear-gradient(160deg, #2A1410 0%, #1A0E10 60%, #0E0610 100%);
               color:#fff; }
  #root { width:100%; height:100vh; display:flex;
          align-items:center; justify-content:center; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="OnboardingScreen.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="CourseDetailScreen.jsx"></script>
<script type="text/babel" src="FlashcardScreen.jsx"></script>
<script type="text/babel" src="ProfileScreen.jsx"></script>
<script type="text/babel" src="LeaderboardScreen.jsx"></script>
<script type="text/babel" src="DictionaryScreen.jsx"></script>
<script type="text/babel" src="GamesScreen.jsx"></script>
<script type="text/babel" src="SettingsScreen.jsx"></script>
<script type="text/babel" src="PremiumSheet.jsx"></script>

<script type="text/babel">
function App() {
  const [user, setUser] = React.useState({ name:"Анна", xp:1240, streak:12 });
  const [route, setRoute] = React.useState("home");
  const [tab, setTab]     = React.useState("home");
  const [course, setCourse] = React.useState("A1");
  const [premium, setPremium] = React.useState(false);

  let screen;
  if (route === "course") {
    screen = <CourseDetailScreen level={course}
                                 onBack={() => setRoute("home")}
                                 onOpenLesson={() => setRoute("flash")}/>;
  } else if (route === "flash") {
    screen = <FlashcardScreen onExit={() => setRoute("course")}/>;
  } else if (route === "profile") {
    screen = <ProfileScreen user={user} onBack={() => setRoute("home")}
                            onOpenSettings={() => setRoute("settings")}
                            onOpenPremium={() => setPremium(true)}/>;
  } else if (route === "leaderboard") {
    screen = <LeaderboardScreen user={user} onBack={() => { setTab("home"); setRoute("home"); }}/>;
  } else if (route === "dictionary") {
    screen = <DictionaryScreen/>;
  } else if (route === "games") {
    screen = <GamesScreen/>;
  } else if (route === "settings") {
    screen = <SettingsScreen user={user} onBack={() => setRoute("profile")}/>;
  } else {
    screen = <HomeScreen
                user={user}
                onOpenCourse={(lv) => { setCourse(lv); setRoute("course"); }}
                onOpenProfile={() => setRoute("profile")}/>;
  }

  const showNav = route !== "flash";

  return (
    <IOSDevice width={402} height={874} dark={false}>
      <div data-screen-label={route} style={{
        width:"100%", height:"100%",
        display:"flex", flexDirection:"column",
        background: EASPEAK.bgGray,
      }}>
        <div style={{flex:1, minHeight:0, position:"relative", overflow:"hidden"}}>
          {screen}
        </div>
        {showNav && (
          <BottomNav active={tab} onChange={(id) => {
            setTab(id);
            if (id === "profile")          setRoute("profile");
            else if (id === "home")        setRoute("home");
            else if (id === "leaderboard") setRoute("leaderboard");
            else if (id === "dictionary")  setRoute("dictionary");
            else if (id === "games")       setRoute("games");
          }}/>
        )}
        {premium && <PremiumSheet onClose={() => setPremium(false)}/>}
      </div>
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
