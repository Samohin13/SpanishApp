name: Generate Article Images (Recraft)

# Запускается ВРУЧНУЮ из вкладки "Actions" в GitHub.
# С телефона: GitHub mobile app → Actions → этот workflow → Run workflow.
#
# Требует секрет RECRAFT_API_KEY в Settings → Secrets and variables → Actions.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Что генерировать'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - world1
          - all

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Generate (${{ inputs.mode }})
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "ERROR: secret PEXELS_API_KEY is empty."
            echo "Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "${{ inputs.mode }}" in
            test)   python scripts/generate_article_images.py --test ;;
            world1) python scripts/generate_article_images.py --world 1 ;;
            all)    python scripts/generate_article_images.py --all ;;
          esac

      - name: Show generated files
        run: |
          echo "=== Generated images ==="
          find app/src/main/assets/article_images -type f -name '*.png' | sort
          echo ""
          echo "=== Total ==="
          find app/src/main/assets/article_images -type f -name '*.png' | wc -l

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/article_images/
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Articulos: generated images via Recraft (${{ inputs.mode }})"
          git push origin HEAD:${{ github.ref_name }}
